name: Sync adminuploadeddesigns to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'adminuploadeddesigns/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Sync adminuploadeddesigns to VPS with rsync
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz -e "ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            adminuploadeddesigns/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/adminuploadeddesigns/